plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.zoon.rideflow"
    compileSdk = 35
    ndkVersion = "25.1.8937393"
    def isAdminBuild = project.hasProperty('adminBuild')

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // RideFlow - Limousine & Shipping Platform
        applicationId = isAdminBuild ? "com.zoon.admin" : "com.zoon.rideflow"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    defaultConfig.manifestPlaceholders.appLabel = isAdminBuild ? 'Zoon Admin' : 'Zoon'

    signingConfigs {
        release {
            keyAlias = 'zoon'
            keyPassword = 'aymanayman1379'
            storeFile = file('keystore.jks')
            storePassword = 'aymanayman1379'
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            
            // ProGuard معطل مؤقتاً - سيتم تفعيله لاحقاً
            minifyEnabled false
            shrinkResources false
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}



