plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.zoon.app"
    compileSdk = 36
    ndkVersion = "26.3.11579264"
    def isAdminBuild = project.hasProperty('adminBuild')
    def isDriverBuild = project.hasProperty('driverBuild')
    def isCompanyBuild = project.hasProperty('companyBuild')

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // RideFlow - Limousine & Shipping Platform
        applicationId = isCompanyBuild ? "com.zoon.company" : (isDriverBuild ? "com.zoon.driver" : (isAdminBuild ? "com.zoon.admin" : "com.zoon.app"))
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        // Explicit Play version — keep in sync with pubspec.yaml (1.2.9+51)
        versionCode = 51
        versionName = "1.2.9"
    }

    defaultConfig.manifestPlaceholders.appLabel = isCompanyBuild ? 'Zoon Company' : (isDriverBuild ? 'Zoon Driver' : (isAdminBuild ? 'Zoon Admin' : 'Zoon'))

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
